<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 반 익명게시판</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
        }

        .card-enter {
            animation: slideUpFade 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .custom-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 pb-20 selection:bg-indigo-500 selection:text-white">

    <!-- Top Bar with File Download Option -->
    <div class="bg-indigo-900 text-indigo-100 text-xs py-2 px-4">
        <div class="max-w-3xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-center sm:text-left">
            <span class="flex items-center gap-1.5 font-medium">
                <span>📁</span> 내 컴퓨터/핸드폰에 파일로 저장하여 언제든 열어볼 수 있습니다!
            </span>
            <button onclick="downloadSelfHtml()" class="bg-indigo-500 hover:bg-indigo-400 text-white font-bold px-3 py-1 rounded-lg text-xs transition shadow flex items-center justify-center gap-1 shrink-0 active:scale-95">
                <span>📥</span> 다운로드 (HTML 파일 저장)
            </button>
        </div>
    </div>

    <!-- Main Header -->
    <header class="sticky top-0 z-20 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white text-xl font-extrabold shadow-indigo-200 shadow-lg">
                    🏫
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-extrabold text-slate-900 leading-tight flex items-center gap-2">
                        우리 반 익명게시판
                    </h1>
                    <p class="text-xs text-slate-500 font-medium">자유롭고 솔직한 우리들의 반 소통 공간</p>
                </div>
            </div>

            <!-- Storage Badge -->
            <div id="storageBadge" class="px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1.5 transition-all bg-emerald-50 text-emerald-700 border border-emerald-200/80">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="storageBadgeText">저장됨 (자동 보존)</span>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-3xl mx-auto px-4 mt-6 space-y-6">

        <!-- Ethics Banner -->
        <div class="bg-amber-50/90 border border-amber-200/90 rounded-2xl p-4 flex items-start gap-3 shadow-xs">
            <span class="text-amber-500 text-xl shrink-0">💛</span>
            <div class="text-xs sm:text-sm text-amber-900 leading-relaxed font-medium">
                <strong>서로를 배려하는 고운 말 약속:</strong> 친구들의 의견을 존중하고 따뜻하게 소통해 주세요.<br class="hidden sm:inline">
                <span class="text-amber-800 font-bold underline decoration-amber-300">남을 비방, 모욕하는 말이나 욕설은 삼가해주세요.</span>
            </div>
        </div>

        <!-- Create Post Card -->
        <section class="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200/80 shadow-sm transition-all focus-within:border-indigo-300 focus-within:ring-4 focus-within:ring-indigo-50/60">
            <h2 class="text-sm font-bold text-slate-700 mb-4 flex items-center gap-2">
                ✍️ 새 글 쓰기
            </h2>

            <form id="postForm" onsubmit="handlePostSubmit(event)" class="space-y-4">
                <!-- Author Mode Radio Options -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">
                        작성자 표시 모드
                    </label>
                    <div class="flex flex-wrap gap-2 sm:gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="postAuthorType" value="anonymous" checked onchange="handlePostAuthorTypeChange()" class="peer sr-only">
                            <span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 text-xs sm:text-sm font-medium rounded-xl border border-slate-200 text-slate-600 peer-checked:bg-indigo-50 peer-checked:border-indigo-500 peer-checked:text-indigo-700 peer-checked:font-bold transition">
                                🕵️ 익명
                            </span>
                        </label>

                        <label class="cursor-pointer">
                            <input type="radio" name="postAuthorType" value="nickname" onchange="handlePostAuthorTypeChange()" class="peer sr-only">
                            <span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 text-xs sm:text-sm font-medium rounded-xl border border-slate-200 text-slate-600 peer-checked:bg-blue-50 peer-checked:border-blue-500 peer-checked:text-blue-700 peer-checked:font-bold transition">
                                🎭 별명
                            </span>
                        </label>

                        <label class="cursor-pointer">
                            <input type="radio" name="postAuthorType" value="realname" onchange="handlePostAuthorTypeChange()" class="peer sr-only">
                            <span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 text-xs sm:text-sm font-medium rounded-xl border border-slate-200 text-slate-600 peer-checked:bg-emerald-50 peer-checked:border-emerald-500 peer-checked:text-emerald-700 peer-checked:font-bold transition">
                                📛 본명 오픈
                            </span>
                        </label>
                    </div>
                </div>

                <!-- Custom Name Input (Hidden for anonymous) -->
                <div id="postAuthorNameWrapper" class="hidden">
                    <input type="text" id="postAuthorNameInput" placeholder="이름/별명을 입력하세요"
                           class="w-full sm:w-80 px-3.5 py-2 text-xs sm:text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition">
                </div>

                <!-- Post Textarea -->
                <div>
                    <textarea id="postContentInput" rows="3" required
                              placeholder="남을 비방, 모욕하는 말을 삼가해주세요."
                              class="w-full px-4 py-3 text-sm text-slate-800 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition resize-none placeholder:text-slate-400 placeholder:text-xs sm:placeholder:text-sm"></textarea>
                </div>

                <!-- Submit Button Bar -->
                <div class="flex items-center justify-between pt-1">
                    <span class="text-xs text-slate-400">작성한 글은 브라우저에 자동 보존됩니다.</span>
                    <button type="submit"
                            class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold text-xs sm:text-sm rounded-xl shadow-md shadow-indigo-200 transition">
                        게시물 등록하기
                    </button>
                </div>
            </form>
        </section>

        <!-- Posts List Section -->
        <section class="space-y-4">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-sm font-bold text-slate-700 flex items-center gap-2">
                    💬 전체 게시글 <span id="postCountBadge" class="px-2.5 py-0.5 text-xs bg-indigo-100 text-indigo-700 font-extrabold rounded-full">0</span>
                </h2>

                <button onclick="confirmResetAll()" class="text-xs text-slate-400 hover:text-rose-600 transition flex items-center gap-1 font-medium">
                    🗑️ 전체 게시글 초기화
                </button>
            </div>

            <!-- Posts Dynamic Insertion Container -->
            <div id="postsContainer" class="space-y-4"></div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden bg-white rounded-2xl p-10 text-center border border-dashed border-slate-200 text-slate-400">
                <div class="text-4xl mb-3">🎈</div>
                <p class="text-sm font-bold text-slate-600">아직 등록된 게시글이 없습니다.</p>
                <p class="text-xs text-slate-400 mt-1">첫 번째 의견이나 하고 싶은 이야기를 남겨보세요!</p>
            </div>
        </section>
    </main>

    <!-- Custom Modal -->
    <div id="customModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl space-y-4 transform transition-all scale-95 opacity-0" id="modalBox">
            <div id="modalTitle" class="text-base font-bold text-slate-900">확인</div>
            <div id="modalMessage" class="text-sm text-slate-600 leading-relaxed">내용</div>
            <div class="flex justify-end gap-2 pt-2">
                <button id="modalCancelBtn" onclick="closeModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">
                    취소
                </button>
                <button id="modalConfirmBtn" class="px-4 py-2 text-xs font-semibold bg-rose-600 hover:bg-rose-700 text-white rounded-xl shadow-sm transition">
                    확인
                </button>
            </div>
        </div>
    </div>

    <script>
        // Storage Key
        const STORAGE_KEY = 'class_board_posts_v3';

        // State variables
        let posts = [];
        let isLocalStorageAvailable = false;

        // Check if LocalStorage works safely
        function checkStorageAvailability() {
            try {
                const testKey = '__test_storage__';
                window.localStorage.setItem(testKey, testKey);
                window.localStorage.removeItem(testKey);
                isLocalStorageAvailable = true;
            } catch (e) {
                isLocalStorageAvailable = false;
            }
            updateBadgeUI();
        }

        function updateBadgeUI() {
            const badge = document.getElementById('storageBadge');
            const badgeText = document.getElementById('storageBadgeText');
            
            if (isLocalStorageAvailable) {
                badge.className = "px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1.5 transition-all bg-emerald-50 text-emerald-700 border border-emerald-200/80";
                badgeText.textContent = "자동 저장 중 (브라우저)";
            } else {
                badge.className = "px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1.5 transition-all bg-amber-50 text-amber-700 border border-amber-200/80";
                badgeText.textContent = "임시 세션 저장 모드";
            }
        }

        // Load Posts from LocalStorage with safe fallback
        function loadPosts() {
            if (isLocalStorageAvailable) {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        posts = JSON.parse(raw);
                        return;
                    }
                } catch (e) {
                    console.warn('LocalStorage read failed', e);
                }
            }

            // Default initial sample posts
            posts = [
                {
                    id: 1,
                    authorType: 'anonymous',
                    authorName: '익명',
                    content: '오늘 체육 시간에 한 피구 너무 재밌었어요! 다음에도 피구 또 해요 😊',
                    createdAt: '10분 전',
                    comments: [
                        { id: 101, authorType: 'nickname', authorName: '체육왕', text: '인정! 오늘 피구 역대급으로 꿀잼이었음 ㅋㅋㅋ', createdAt: '8분 전' },
                        { id: 102, authorType: 'anonymous', authorName: '익명', text: '다음엔 피구 말고 축구도 하고 싶어요!', createdAt: '5분 전' }
                    ]
                },
                {
                    id: 2,
                    authorType: 'nickname',
                    authorName: '맛있는급식',
                    content: '오늘 점심 메뉴 돈가스 맛 어땠나요? 다들 맛있게 드셨나요?',
                    createdAt: '1시간 전',
                    comments: [
                        { id: 103, authorType: 'realname', authorName: '김민준', text: '소스가 약간 매콤해서 더 맛있었어!', createdAt: '45분 전' }
                    ]
                }
            ];
        }

        // Save Posts
        function savePosts() {
            if (isLocalStorageAvailable) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
                } catch (e) {
                    console.warn('LocalStorage write failed', e);
                }
            }
        }

        // Handle Main Post Author Type Selection Toggle
        function handlePostAuthorTypeChange() {
            const authorType = document.querySelector('input[name="postAuthorType"]:checked').value;
            const wrapper = document.getElementById('postAuthorNameWrapper');
            const input = document.getElementById('postAuthorNameInput');

            if (authorType === 'anonymous') {
                wrapper.classList.add('hidden');
                input.value = '';
            } else {
                wrapper.classList.remove('hidden');
                input.placeholder = authorType === 'nickname' ? '사용할 별명을 입력하세요' : '본명을 입력하세요';
                input.focus();
            }
        }

        // Handle Comment Author Type Selection Toggle per post
        function handleCommentAuthorTypeChange(postId) {
            const authorType = document.querySelector(`input[name="commentAuthorType-${postId}"]:checked`).value;
            const wrapper = document.getElementById(`commentAuthorNameWrapper-${postId}`);
            const input = document.getElementById(`commentAuthorNameInput-${postId}`);

            if (authorType === 'anonymous') {
                wrapper.classList.add('hidden');
                input.value = '';
            } else {
                wrapper.classList.remove('hidden');
                input.placeholder = authorType === 'nickname' ? '별명' : '본명';
                input.focus();
            }
        }

        // HTML Escape Helper
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Render Badge for Post/Comment Author
        function getAuthorTagHtml(type) {
            if (type === 'nickname') {
                return `<span class="px-2 py-0.5 text-[10px] sm:text-[11px] font-bold bg-blue-50 text-blue-600 rounded-md border border-blue-100/80 shrink-0">별명</span>`;
            } else if (type === 'realname') {
                return `<span class="px-2 py-0.5 text-[10px] sm:text-[11px] font-bold bg-emerald-50 text-emerald-700 rounded-md border border-emerald-100/80 shrink-0">본명 오픈</span>`;
            }
            return `<span class="px-2 py-0.5 text-[10px] sm:text-[11px] font-bold bg-slate-100 text-slate-600 rounded-md border border-slate-200/80 shrink-0">익명</span>`;
        }

        // Main Render Function
        function renderPosts() {
            const container = document.getElementById('postsContainer');
            const emptyState = document.getElementById('emptyState');
            const badge = document.getElementById('postCountBadge');

            badge.textContent = posts.length;

            if (posts.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            container.innerHTML = posts.map(post => {
                const comments = post.comments || [];
                return `
                <article class="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200/80 shadow-xs hover:shadow-sm transition space-y-4 card-enter">
                    <!-- Post Header -->
                    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="font-bold text-sm sm:text-base text-slate-800">${escapeHtml(post.authorName)}</span>
                            ${getAuthorTagHtml(post.authorType)}
                        </div>
                        <div class="flex items-center gap-2.5">
                            <span class="text-xs text-slate-400 font-medium">${post.createdAt}</span>
                            <button onclick="requestDeletePost(${post.id})" class="text-xs text-slate-400 hover:text-rose-600 font-medium transition px-1.5 py-0.5 rounded hover:bg-rose-50" title="게시글 지우기">
                                삭제
                            </button>
                        </div>
                    </div>

                    <!-- Post Body Content -->
                    <p class="text-sm sm:text-base text-slate-800 leading-relaxed whitespace-pre-wrap break-words font-normal">${escapeHtml(post.content)}</p>

                    <!-- Comment Section Container -->
                    <div class="pt-3 border-t border-slate-100 space-y-3.5">
                        <div class="flex items-center justify-between text-xs font-bold text-slate-500">
                            <span class="flex items-center gap-1.5">
                                <span>💬</span> 댓글 <span class="text-indigo-600 font-extrabold">${comments.length}</span>개
                            </span>
                        </div>

                        <!-- Render Comment List -->
                        ${comments.length > 0 ? `
                            <div class="space-y-2 bg-slate-50/80 p-3 sm:p-3.5 rounded-xl border border-slate-200/60 max-h-60 overflow-y-auto custom-scroll">
                                ${comments.map(comment => `
                                    <div class="text-xs sm:text-sm text-slate-700 flex items-start justify-between gap-2 p-1.5 hover:bg-white/60 rounded-lg transition">
                                        <div class="flex items-start gap-2 break-words flex-1">
                                            <div class="flex items-center gap-1 shrink-0">
                                                <span class="font-bold text-slate-700">${escapeHtml(comment.authorName)}</span>
                                                ${getAuthorTagHtml(comment.authorType)}
                                            </div>
                                            <span class="text-slate-700 leading-normal">${escapeHtml(comment.text)}</span>
                                        </div>
                                        <div class="flex items-center gap-1.5 shrink-0 ml-1">
                                            <span class="text-[10px] text-slate-400">${comment.createdAt || ''}</span>
                                            <button onclick="requestDeleteComment(${post.id}, ${comment.id})" class="text-[10px] text-slate-300 hover:text-rose-600 font-bold transition">
                                                지우기
                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}

                        <!-- Add Comment Form with Author Type Options -->
                        <form onsubmit="handleCommentSubmit(event, ${post.id})" class="bg-slate-50/60 p-3 rounded-xl border border-slate-200/60 space-y-2.5">
                            <!-- Comment Author Mode Selector -->
                            <div class="flex items-center gap-2 text-xs flex-wrap">
                                <span class="text-slate-400 font-semibold text-[11px]">댓글 작성자:</span>
                                <label class="cursor-pointer">
                                    <input type="radio" name="commentAuthorType-${post.id}" value="anonymous" checked onchange="handleCommentAuthorTypeChange(${post.id})" class="peer sr-only">
                                    <span class="px-2 py-0.5 text-[11px] font-medium rounded-lg border border-slate-200 text-slate-600 peer-checked:bg-indigo-50 peer-checked:border-indigo-500 peer-checked:text-indigo-700 transition">익명</span>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="commentAuthorType-${post.id}" value="nickname" onchange="handleCommentAuthorTypeChange(${post.id})" class="peer sr-only">
                                    <span class="px-2 py-0.5 text-[11px] font-medium rounded-lg border border-slate-200 text-slate-600 peer-checked:bg-blue-50 peer-checked:border-blue-500 peer-checked:text-blue-700 transition">별명</span>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="commentAuthorType-${post.id}" value="realname" onchange="handleCommentAuthorTypeChange(${post.id})" class="peer sr-only">
                                    <span class="px-2 py-0.5 text-[11px] font-medium rounded-lg border border-slate-200 text-slate-600 peer-checked:bg-emerald-50 peer-checked:border-emerald-500 peer-checked:text-emerald-700 transition">본명</span>
                                </label>

                                <!-- Hidden Custom Comment Author Name Input -->
                                <div id="commentAuthorNameWrapper-${post.id}" class="hidden ml-1">
                                    <input type="text" id="commentAuthorNameInput-${post.id}" placeholder="이름"
                                           class="px-2 py-0.5 text-xs bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 w-24">
                                </div>
                            </div>

                            <!-- Comment Input & Submit Bar -->
                            <div class="flex items-center gap-2">
                                <input type="text" id="comment-input-${post.id}" required
                                       placeholder="남을 비방, 모욕하는 말을 삼가해주세요."
                                       class="flex-1 px-3 py-1.5 text-xs sm:text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 transition placeholder:text-slate-400 placeholder:text-xs">
                                <button type="submit" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold rounded-xl transition active:scale-95 shrink-0">
                                    댓글 등록
                                </button>
                            </div>
                        </form>
                    </div>
                </article>
                `;
            }).join('');
        }

        // Handle New Post Submission
        function handlePostSubmit(e) {
            e.preventDefault();
            const authorType = document.querySelector('input[name="postAuthorType"]:checked').value;
            const customName = document.getElementById('postAuthorNameInput').value.trim();
            const content = document.getElementById('postContentInput').value.trim();

            if (!content) return;

            let authorName = '익명';
            if (authorType === 'nickname') {
                authorName = customName || '익명 별명';
            } else if (authorType === 'realname') {
                authorName = customName || '익명 학생';
            }

            const now = new Date();
            const timeFormatted = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

            const newPost = {
                id: Date.now(),
                authorType,
                authorName,
                content,
                createdAt: timeFormatted,
                comments: []
            };

            posts.unshift(newPost);
            savePosts();

            // Reset form
            document.getElementById('postForm').reset();
            handlePostAuthorTypeChange();
            renderPosts();
        }

        // Handle Comment Submission
        function handleCommentSubmit(e, postId) {
            e.preventDefault();
            const authorType = document.querySelector(`input[name="commentAuthorType-${postId}"]:checked`).value;
            const customNameInput = document.getElementById(`commentAuthorNameInput-${postId}`);
            const customName = customNameInput ? customNameInput.value.trim() : '';
            const commentInput = document.getElementById(`comment-input-${postId}`);
            const text = commentInput.value.trim();

            if (!text) return;

            let authorName = '익명';
            if (authorType === 'nickname') {
                authorName = customName || '별명';
            } else if (authorType === 'realname') {
                authorName = customName || '본명';
            }

            const targetPost = posts.find(p => p.id === postId);
            if (targetPost) {
                if (!targetPost.comments) targetPost.comments = [];

                const now = new Date();
                const timeFormatted = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

                targetPost.comments.push({
                    id: Date.now(),
                    authorType,
                    authorName,
                    text,
                    createdAt: timeFormatted
                });

                savePosts();
                renderPosts();
            }
        }

        // Post and Comment Deletion Request Modals
        function requestDeletePost(postId) {
            showModal('게시글 삭제', '이 게시글을 삭제하시겠습니까?', () => {
                posts = posts.filter(p => p.id !== postId);
                savePosts();
                renderPosts();
            });
        }

        function requestDeleteComment(postId, commentId) {
            showModal('댓글 삭제', '이 댓글을 삭제하시겠습니까?', () => {
                const targetPost = posts.find(p => p.id === postId);
                if (targetPost && targetPost.comments) {
                    targetPost.comments = targetPost.comments.filter(c => c.id !== commentId);
                    savePosts();
                    renderPosts();
                }
            });
        }

        function confirmResetAll() {
            showModal('전체 초기화', '모든 게시글과 댓글을 지우시겠습니까?', () => {
                posts = [];
                savePosts();
                renderPosts();
            });
        }

        // Custom Modal Logic
        let modalConfirmCallback = null;

        function showModal(title, message, onConfirm) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            modalConfirmCallback = onConfirm;

            const modal = document.getElementById('customModal');
            const box = document.getElementById('modalBox');

            modal.classList.remove('hidden');
            setTimeout(() => {
                box.classList.remove('scale-95', 'opacity-0');
                box.classList.add('scale-100', 'opacity-100');
            }, 10);

            document.getElementById('modalConfirmBtn').onclick = () => {
                if (modalConfirmCallback) modalConfirmCallback();
                closeModal();
            };
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            const box = document.getElementById('modalBox');

            box.classList.remove('scale-100', 'opacity-100');
            box.classList.add('scale-95', 'opacity-0');

            setTimeout(() => {
                modal.classList.add('hidden');
            }, 150);
        }

        // Self Download Functionality
        function downloadSelfHtml() {
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8;' });
            
            // Temporary link creation for download
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '우리반_익명게시판.html';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }

        // Initialization on Load
        window.onload = function() {
            checkStorageAvailability();
            loadPosts();
            renderPosts();
        };
    </script>
</body>
</html>
